# kb-abac —— 单站点 demo（站点 + shared 引擎）
#
#   docker compose up -d --build
#   → http://127.0.0.1:10097/
#
# build context = 仓库根（server.lume / data / www / shared 都在 context 内）。
# 容器内 server.lume 用 import "./shared/abac.lume" 引用共享引擎，与宿主一致。
#
# lume 运行时由 Dockerfile 从 GitHub Release 拉取官方静态二进制，不再依赖
# 本地自建的 lume 基础镜像。可用 LUME_VERSION 固定/升级运行时版本：
#   LUME_VERSION=v0.11.0 docker compose up -d --build
# 版本清单见 https://github.com/erishen/lume/releases
# ============================================================================

name: kb-abac

services:
  site:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        LUME_VERSION: ${LUME_VERSION:-v0.11.0}
    image: kb-abac:latest
    container_name: kb-abac
    ports:
      # 只绑回环：演示用途，无需暴露到局域网
      - "${HOST_BIND:-127.0.0.1}:${DOCKER_PORT:-10097}:8097"
    restart: unless-stopped
